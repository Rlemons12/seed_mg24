<aside id="shell-sidebar" class="mg-shell__sidebar" aria-label="Gateway modules">
  <div class="mg-shell__brand">
    <span class="mg-shell__brand-mark" aria-hidden="true">S</span>
    <div><strong>Seed Gateway</strong><span>Sensor operations</span></div>
  </div>
  <nav class="mg-shell__nav" aria-label="Primary navigation">
    <a class="mg-shell__nav-link{% if current_module == 'overview' %} is-active{% endif %}" href="{{ url_for('dashboard') }}" data-module-target="overview"{% if current_module == 'overview' %} aria-current="page"{% endif %}>
      <span aria-hidden="true">◫</span><span>Overview</span>
    </a>
    <a class="mg-shell__nav-link" href="{{ url_for('dashboard') }}#devices" data-module-target="devices">
      <span aria-hidden="true">◉</span><span>Devices</span>
    </a>
    <a class="mg-shell__nav-link" href="{{ url_for('dashboard') }}?action=add-sensor" data-shell-action="add-sensor">
      <span aria-hidden="true">＋</span><span>Add Sensor</span>
    </a>
    <a class="mg-shell__nav-link{% if current_module == 'installations' %} is-active{% endif %}" href="{{ url_for('installations_page') }}" data-module-target="installations"{% if current_module == 'installations' %} aria-current="page"{% endif %}>
      <span aria-hidden="true">◇</span><span>Installations</span>
    </a>
    <a class="mg-shell__nav-link" href="{{ url_for('dashboard') }}?action=firmware" data-shell-action="firmware">
      <span aria-hidden="true">⇧</span><span>Firmware</span>
    </a>
    <a class="mg-shell__nav-link{% if current_module == 'system-health' %} is-active{% endif %}" href="{{ url_for('system_health_page') }}" data-module-target="system-health"{% if current_module == 'system-health' %} aria-current="page"{% endif %}>
      <span aria-hidden="true">♡</span><span>System health</span>
    </a>
  </nav>
  <div class="mg-shell__sidebar-footer">
    <span class="mg-shell__label">Appearance</span>
    <label class="mg-shell__theme-control">
      <span class="mg-shell__sr-only">Color theme</span>
      <select id="shell-theme-select">
        <option value="gateway">Gateway light</option>
        <option value="gateway-dark">Gateway dark</option>
      </select>
    </label>
    <p>Local dashboard · Protected operations</p>
  </div>
</aside>
