[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["gateway/tests", "sensor_package/tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"gateway/tests/*" = ["E701", "E702"]
